<!doctype html>
<meta charset="utf-8">
<title>VM manager: legacy Nokia N97</title>
<pre id="log"></pre>
<pre id="result"></pre>
<script type="module">
import { VMStore, config_images } from "../../src/app/vm_store.js";
import { disk_file, disk_id, list_disks } from "../../src/app/browser_disks.js";
import { N97_BML_USER_BLOCKS, N97_FLASH_BLOCK, N97_FLASH_HEADER, N97_FLASH_IMAGE_SIZE, N97_FLASH_PAGE, N97_FLASH_SLOT,
    N97_FLASH_SIZE } from "../../src/symbian/n97_flash.js";
import { N97_EMMC_SIZE } from "../../src/symbian/n97_mmc_media.js";
import { N97_EMMC_INITIAL_BYTES } from "../../src/symbian/n97_emmc_format.js";
import { read_sis_card } from "../symbian/fixtures/read_sis_card.js";

const local = new URLSearchParams(location.search).has("local");
const fixture = "/build/symbian/test-package/";
const log = text => document.querySelector("#log").textContent += text + "\n";
const result = document.querySelector("#result");
function check(value, what) { if(!value) throw new Error(what); }
async function until(callback, what)
{
    for(let attempt = 0; attempt < 1200; attempt++)
    {
        const found = await callback();
        if(found) return found;
        await new Promise(resolve => setTimeout(resolve, 50));
    }
    throw new Error("Timed out waiting for " + what);
}
function frame(url)
{
    const element = document.createElement("iframe");
    element.src = url;
    element.style.cssText = "width:100%;height:730px;";
    document.body.append(element);
    return element;
}
function choose(input, files)
{
    const w = input.ownerDocument.defaultView;
    const data = new w.DataTransfer();
    for(const file of files) data.items.add(file);
    input.files = data.files;
    input.dispatchEvent(new w.Event("change", { bubbles: true }));
}
function button(scope, label)
{
    return scope && [...scope.querySelectorAll("button")].find(button => !button.disabled && button.textContent.trim() === label);
}
function expected_assets(config)
{
    const roles = Object.keys(config.symbian.media).sort().join(",");
    check(roles === "boot_media,nand,phone,rofs1,rofs2,rofs3,rom", "all seven outputs are registered");
    return config_images(config);
}
async function hash(file)
{
    const digest = new Uint8Array(await crypto.subtle.digest("SHA-256", await file.arrayBuffer()));
    return [...digest].map(value => value.toString(16).padStart(2, "0")).join("");
}

async function notes_package(version, name = "notes-v" + version + ".sisx")
{
    const response = await fetch("../symbian/fixtures/notes-v" + version + ".sisx");
    check(response.ok, "shipped SIS fixture");
    return new File([await response.blob()], name);
}

async function worker_diagnostics(emulator)
{
    let timer, on_error;
    try
    {
        return await Promise.race([
            new Promise((resolve, reject) => {
                on_error = error => reject(new Error("CPU Worker failed: " + (error?.message || error)));
                emulator.add_listener("emulator-error", on_error);
                timer = setTimeout(() => reject(new Error("CPU Worker diagnostics did not respond")), 15000);
            }),
            emulator.get_diagnostics(),
        ]);
    }
    finally
    {
        clearTimeout(timer);
        emulator.remove_listener("emulator-error", on_error);
    }
}

async function check_n97_keyboard(frame, emulator)
{
    const doc = frame.contentDocument, win = doc.defaultView;
    const read = () => worker_diagnostics(emulator).then(d => d.symbian);
    const pressed = expected => until(async () => {
        const actual = (await read()).keyboard.pressed.slice().sort((a, b) => a - b);
        return JSON.stringify(actual) === JSON.stringify(expected.slice().sort((a, b) => a - b));
    }, "physical keypad contacts " + expected.join(","));
    doc.querySelector("#drawer_keyboard").click();
    const keyboard = doc.querySelector("#n97_keyboard");
    const slider = doc.querySelector("#n97_slider");
    const key = name => keyboard.querySelector('[data-key="' + name + '"]');
    const keys = (type, code, repeat = false) => keyboard.dispatchEvent(new win.KeyboardEvent(type, {
        code, repeat, bubbles: true, cancelable: true,
    }));
    const pointer = (name, type, pointerId) => key(name).dispatchEvent(new win.PointerEvent(type, {
        button: 0, bubbles: true, cancelable: true, pointerId, pointerType: "touch",
    }));
    const panel_contact = (contact, lock_pressed) => until(async () => {
        const state = await read();
        return state.touch.contact === contact && state.lock_pressed === lock_pressed;
    }, "front contact " + contact + " and side lock " + lock_pressed);
    check(slider.textContent === "Open slider" && key("Q").closest(".n97-slide-keys").hidden, "closed slider hides its QWERTY keys");
    const power_state = async pressed => {
        await until(async () => (await read()).power_pressed === pressed, "AVILMA power key " + pressed);
        check(key("Power").getAttribute("aria-pressed") === String(pressed), "phone power key exposes its held state");
    };
    check(key("Power").getAttribute("aria-label") === "Phone power key", "phone power key has a distinct control");
    pointer("Power", "pointerdown", 3);
    await power_state(true);
    keys("keydown", "F9");
    keys("keydown", "F9", true);
    pointer("Power", "pointercancel", 3);
    await power_state(true);
    keys("keyup", "F9");
    await power_state(false);
    keys("keydown", "F9");
    await power_state(true);
    win.dispatchEvent(new win.Event("blur"));
    await power_state(false);
    pointer("Send", "pointerdown", 4);
    await panel_contact("send", false);
    pointer("Lock", "pointerdown", 5);
    await panel_contact("send", true);
    pointer("Send", "pointercancel", 4);
    await panel_contact(null, true);
    if(!local)
    {
        await check_n97_display(doc, false, true);
        const { panel } = await read();
        check(panel.managed && !panel.display_on && panel.pixels_received === 640 * 360, "guest switches off the TFT with all pixels still in GRAM");
    }
    pointer("Lock", "lostpointercapture", 5);
    await panel_contact(null, false);
    if(!local) await check_n97_display(doc, false);
    keys("keydown", "End");
    await panel_contact("end", false);
    keys("keyup", "End");
    await panel_contact(null, false);
    keys("keydown", "Home");
    await panel_contact("send", false);
    keys("keyup", "Home");
    await panel_contact(null, false);
    pointer("Menu", "pointerdown", 6);
    await pressed([0x35]);
    pointer("Menu", "pointerup", 6);
    await pressed([]);
    pointer("CameraShutter", "pointerdown", 6);
    await pressed([0x0F, 0x1F]);
    pointer("CameraShutter", "pointercancel", 6);
    await pressed([]);

    slider.click();
    await until(async () => (await read()).slider_open, "open Hall sensor at CPU Worker");
    check(doc.activeElement === keyboard && !key("Q").closest(".n97-slide-keys").hidden, "open slider exposes and focuses keyboard");
    keys("keydown", "ShiftLeft");
    keys("keydown", "ShiftRight");
    keys("keydown", "KeyQ");
    keys("keydown", "KeyQ", true);
    await pressed([0x31, 1]);
    keys("keyup", "ShiftLeft");
    await pressed([0x31, 1]);
    keys("keyup", "KeyQ");
    await pressed([0x31]);
    pointer("Q", "pointerdown", 7);
    pointer("Fn", "pointerdown", 8);
    await pressed([1, 0x31, 0x39]);
    pointer("Q", "lostpointercapture", 7);
    await pressed([0x31, 0x39]);
    doc.querySelector("#drawer_keyboard").focus();
    await pressed([]);
    keyboard.focus();
    keys("keydown", "KeyN");
    await pressed([0x37]);
    win.dispatchEvent(new win.Event("blur"));
    await pressed([]);
    pointer("VolumeUp", "pointerdown", 12);
    keys("keydown", "F4");
    await panel_contact(null, true);
    keys("keydown", "KeyQ");
    await pressed([1, 0x38]);
    slider.click();
    await until(async () => !(await read()).slider_open, "closed Hall sensor at CPU Worker");
    await panel_contact(null, true);
    await pressed([0x38]);
    pointer("VolumeUp", "pointerup", 12);
    win.dispatchEvent(new win.Event("blur"));
    await panel_contact(null, false);
    await pressed([]);
    doc.querySelector("#drawer_keyboard").click();
    check(keyboard.closest("[hidden]"), "normal keyboard drawer closes");
}

async function running_worker(frame)
{
    function startup_failure()
    {
        const error = frame.contentDocument.querySelector(".console-notice .error");
        if(error) throw new Error(error.textContent);
    }
    const console_state = await until(() => {
        startup_failure();
        return frame.contentWindow.v86_console;
    }, "CPU Worker console");
    await until(() => {
        startup_failure();
        return console_state.emulator.get_instruction_counter() > 10;
    }, "guest instruction execution");
    return console_state;
}

async function check_n97_display(doc, landscape, black = false)
{
    const width = landscape ? 640 : 360, height = landscape ? 360 : 640;
    const color_corners = landscape ? [0xFF0000, 0x00FF00, 0x0000FF, 0xFFFFFF] : [0x0000FF, 0xFF0000, 0xFFFFFF, 0x00FF00];
    const canvas = doc.querySelector("#screen_container.n97-touch-screen canvas");
    await until(() => {
        if(canvas.width !== width || canvas.height !== height || !canvas.getBoundingClientRect().width) return false;
        const context = canvas.getContext("2d");
        if(black) return context.getImageData(0, 0, width, height).data.every((byte, index) => byte === (index % 4 === 3 ? 255 : 0));
        return [[1, 1], [width - 2, 1], [1, height - 2], [width - 2, height - 2]].every(([x, y], index) => {
            const [r, g, b, a] = context.getImageData(x, y, 1, 1).data;
            return a === 255 && (r << 16 | g << 8 | b) === color_corners[index];
        });
    }, (black ? "guest turns off the TFT in the " : "guest TFT colors in the ") + (landscape ? "open" : "closed") + " slider canvas");
}

async function check_n97_touch(frame, emulator)
{
    const doc = frame.contentDocument, win = doc.defaultView;
    const screen = doc.querySelector("#screen_container.n97-touch-screen");
    function point(type, pointerId, x, y)
    {
        const box = screen.getBoundingClientRect();
        screen.dispatchEvent(new win.PointerEvent(type, {
            bubbles: true, cancelable: true, button: 0, pointerType: "touch", pointerId,
            clientX: box.left + box.width * x, clientY: box.top + box.height * y,
        }));
    }
    const contact = (pressed, x, y) => until(async () => {
        const touch = (await worker_diagnostics(emulator)).symbian.touch;
        return touch?.pressed === pressed && (x === undefined || touch.x === x && touch.y === y);
    }, "N97 screen contact " + [pressed, x, y].join(" "));
    function geometry(expected)
    {
        const { width, height } = screen.getBoundingClientRect();
        check(width > 0 && Math.abs(width / height - expected) < 0.01, "N97 display has the stock mode's aspect ratio");
    }
    geometry(360 / 640);
    if(!local) await check_n97_display(doc, false);
    point("pointerdown", 11, 0.5, 0.5);
    await contact(true);
    point("pointermove", 11, -0.1, -0.1);
    await contact(true, 0, 359);
    point("pointerdown", 12, 0.8, 0.8);
    point("pointerup", 12, 0.8, 0.8);
    await contact(true, 0, 359);
    point("pointermove", 11, 1.1, 1.1);
    await contact(true, 639, 0);
    point("pointerup", 11, 1.1, 1.1);
    await contact(false, 639, 0);

    point("pointerdown", 13, 0.3, 0.3);
    await contact(true);
    doc.querySelector("#drawer_keyboard").click();
    doc.querySelector("#n97_slider").click();
    await contact(false); // changing the screen mode ends the gesture
    geometry(640 / 360);
    if(!local) await check_n97_display(doc, true);
    point("pointerdown", 13, 0.3, 0.3);
    point("pointermove", 13, 1.1, 1.1);
    await contact(true, 639, 359);
    point("pointercancel", 13, 1.1, 1.1);
    await contact(false, 639, 359);
    point("pointerdown", 14, 0.3, 0.3);
    await contact(true);
    point("lostpointercapture", 14, 0.3, 0.3);
    await contact(false);
    point("pointerdown", 15, 0.3, 0.3);
    await contact(true);
    win.dispatchEvent(new win.Event("blur"));
    await contact(false);
    doc.querySelector("#n97_slider").click();
    doc.querySelector("#drawer_keyboard").click();
    geometry(360 / 640);
}

async function check_n97_keyboard_resume(first, store, id)
{
    const doc = first.contentDocument;
    doc.querySelector("#drawer_keyboard").click();
    doc.querySelector("#n97_slider").click();
    await until(async () => (await worker_diagnostics(first.contentWindow.v86_console.emulator)).symbian.slider_open,
        "open slider before suspend");
    const screen = doc.querySelector("#screen_container.n97-touch-screen"), box = screen.getBoundingClientRect();
    screen.dispatchEvent(new first.contentWindow.PointerEvent("pointerdown", {
        bubbles: true, cancelable: true, button: 0, pointerId: 26, pointerType: "touch",
        clientX: box.left + box.width / 2, clientY: box.top + box.height / 2,
    }));
    await until(async () => (await worker_diagnostics(first.contentWindow.v86_console.emulator)).symbian.touch.pressed,
        "held touchscreen contact before suspend");
    doc.querySelector('[data-key="Lock"]').dispatchEvent(new first.contentWindow.PointerEvent("pointerdown", {
        bubbles: true, cancelable: true, button: 0, pointerId: 27, pointerType: "touch",
    }));
    await until(async () => (await worker_diagnostics(first.contentWindow.v86_console.emulator)).symbian.lock_pressed,
        "held side lock before suspend");
    doc.querySelector('[data-key="Power"]').dispatchEvent(new first.contentWindow.PointerEvent("pointerdown", {
        bubbles: true, cancelable: true, button: 0, pointerId: 28, pointerType: "touch",
    }));
    await until(async () => (await worker_diagnostics(first.contentWindow.v86_console.emulator)).symbian.power_pressed,
        "held phone power key before suspend");
    doc.querySelector("#menu_power").click();
    (await until(() => doc.querySelector("#menu_suspend"), "Suspend menu")).click();
    await until(() => doc.querySelector(".console-status")?.dataset.state === "Suspended", "suspended Nokia N97");
    check((await store.get(id)).suspended, "N97 snapshot registered in the library");
    first.remove();

    const resumed = frame("/index.html?vm=" + id);
    const { emulator } = await running_worker(resumed);
    const reopened = resumed.contentDocument;
    await until(async () => !(await store.get(id)).suspended, "library consumes the suspended N97 state");
    reopened.querySelector("#drawer_keyboard").click();
    await until(() => reopened.querySelector("#n97_slider")?.textContent === "Close slider", "open slider in resumed console");
    const current = (await worker_diagnostics(emulator)).symbian;
    check(current.slider_open && !current.keyboard.pressed.length &&
        !reopened.querySelector(".n97-slide-keys").hidden, "restored Hall level and keyboard drawer agree");
    check(!current.touch.pressed && !current.lock_pressed && !current.power_pressed &&
        reopened.querySelector(".n97-touch-screen").dataset.landscape === "true",
        "restored screen orientation follows Hall and has no stale contact");
    await check_n97_display(reopened, true);
    return resumed;
}

async function power_off(frame)
{
    const doc = frame.contentDocument;
    doc.querySelector("#menu_power").click();
    const item = await until(() => doc.querySelector("#menu_power_off"), "Power menu");
    check(doc.querySelector("#menu_save_and_power_off"), "Power menu supports saving the VM and flushing the writable media");
    item.click();
    const dialog = await until(() => doc.querySelector("dialog[open]"), "confirm power off");
    check(dialog.textContent.includes("disks written back"), "power-off dialog explains persistence");
    button(dialog, "Power off").click();
    await until(() => doc.querySelector(".console-status")?.dataset.state === "Powered off", "powered off and VM lock released");
    frame.remove();
}

let library;
async function open_library()
{
    library?.remove();
    library = frame("/index.html");
    await until(() => library.contentDocument?.querySelector("#new_vm"), "library");
    return library.contentDocument;
}
function files_in_folder(files, directory = "Firmware")
{
    return files.map(file => {
        const copy = new File([file], file.name);
        Object.defineProperty(copy, "webkitRelativePath", { value: directory + "/" + file.name });
        return copy;
    });
}

try
{
    const store = await VMStore.open();
    let doc = await open_library();
    // The shipping wizard only creates Nokia 5800 VMs. Populate these legacy
    // entries through their importer, then exercise the real library and console.
    const { scan_symbian_packages, check_symbian_package, import_symbian_package } =
        await doc.defaultView.eval('import("/src/app/symbian_import.js")');
    async function files_for_legacy_import()
    {
        if(!local)
        {
            return files_in_folder(await Promise.all((await (await fetch(fixture + "fixtures.json")).json()).map(async name =>
                new File([await (await fetch(fixture + name)).blob()], name))));
        }
        const folder = document.createElement("input");
        folder.type = "file";
        folder.webkitdirectory = true;
        document.body.append(folder);
        window.local_firmware_input = folder;
        window.local_firmware_button = folder;
        log("Choose the original RM-505 folder for the legacy compatibility test");
        return new Promise(resolve => folder.addEventListener("change", () => resolve(Array.from(folder.files)), { once: true }));
    }

    const all = await files_for_legacy_import();
    const variant_for = async (files, test) => {
        const { variants } = await scan_symbian_packages(files);
        const variant = variants.find(variant => variant.type_designator === "RM-505" && (!test || variant.product_code === test));
        check(variant, "legacy RM-505 variant");
        return variant;
    };
    const variant = await variant_for(all, local ? null : "059TEST");
    const report = await check_symbian_package(all, variant);
    check(report.media, "complete legacy firmware");
    if(local)
    {
        await import_symbian_package(all, variant, report, "Original RM-505", "", { store });
        doc = await open_library();
    }
    else
    {
        const incomplete = all.filter(file => file.name !== "core.C00");
        check((await check_symbian_package(incomplete, variant)).check.files.some(file =>
            file.name === "core.C00" && file.status === "missing"), "missing legacy CORE is reported");
        const complete = files_in_folder(all, "Firmware/A");
        const unrelated = files_in_folder(incomplete, "Firmware/B");
        const siblings = [...complete, ...unrelated];
        const { variants } = await scan_symbian_packages(siblings);
        check(variants.length === 4, "manifests in both subfolders are read");
        const other = variants.find(variant => variant.manifest.startsWith("Firmware/B/"));
        check((await check_symbian_package(siblings, other)).check.files.some(file =>
            file.name === "core.C00" && file.status === "missing"), "legacy manifest uses only its own folder");

        const first = await import_symbian_package(all, variant, report, "Fixture N97", "", { store });
        const second = await import_symbian_package(all, variant, report, "Second N97", "", { store });
        check(first.symbian.media.phone.path !== second.symbian.media.phone.path, "phone data paths are isolated");
        check(first.symbian.media.nand.path !== second.symbian.media.nand.path, "OneNAND paths are isolated");
        window.second_nand = second.symbian.media.nand;
        check(first.symbian.emmc.path !== second.symbian.emmc.path, "sparse eMMC paths are isolated");
        check(expected_assets(first).length === 8 && expected_assets(second).length === 8, "all assets participate in VM lifecycle");
        const root = await navigator.storage.getDirectory();
        const v86 = await root.getDirectoryHandle("v86");
        const journal = await v86.getDirectoryHandle("symbian-imports");
        const disks = await v86.getDirectoryHandle("disks");
        const abandoned = crypto.randomUUID();
        await journal.getFileHandle(abandoned, { create: true });
        await journal.getFileHandle(first.id, { create: true });
        const orphan = abandoned + "-symbian-rom.img";
        await disks.getFileHandle(orphan, { create: true });
        doc = await open_library();
        let recovered = false;
        try { await disks.getFileHandle(orphan); }
        catch(error) { recovered = error.name === "NotFoundError"; }
        check(recovered && (await list_disks()).length === 16, "reopen reclaimed only abandoned output");
        check((await disk_file(disk_id(first.symbian.media.rom.path))).size > 0, "completed files survived recovery");
    }
    const config = (await store.list()).find(entry => entry.name === (local ? "Original RM-505" : "Fixture N97"));
    check(config && expected_assets(config).length === 8, "stored configuration");
    const rom = config.symbian.media.rom;
    check(await hash(await disk_file(disk_id(rom.path))) === rom.sha256, "stored ROM digest");
    const boot_media = config.symbian.media.boot_media;
    check(await hash(await disk_file(disk_id(boot_media.path))) === boot_media.sha256, "stored DSP0/ISASW digest");
    const nand = config.symbian.media.nand;
    const nand_file = await disk_file(disk_id(nand.path));
    check(nand_file.size === N97_FLASH_IMAGE_SIZE, "stored OneNAND geometry");
    const nand_page = async (block, page = 0) => {
        const at = N97_FLASH_HEADER + (block * N97_FLASH_BLOCK / N97_FLASH_PAGE + page) * N97_FLASH_SLOT;
        return new Uint8Array(await nand_file.slice(at, at + N97_FLASH_SLOT).arrayBuffer()).map(byte => byte ^ 0xFF);
    };
    const first_metadata_page = await nand_page(N97_FLASH_SIZE / N97_FLASH_BLOCK - 1);
    const pia = first_metadata_page.subarray(1024, 1536);
    const pia_words = new DataView(pia.buffer, pia.byteOffset, pia.byteLength);
    check(new TextDecoder().decode(pia.subarray(0, 8)) === "XSRPART5" && pia_words.getUint32(12, true) === 4 &&
        pia_words.getUint32(24, true) === 4, "new OPFS OneNAND has the RM-505 BML partitions from CORE");
    check(first_metadata_page[N97_FLASH_PAGE + 5] === 0xFE, "BML confirmation mark is stored in the spare area");
    const stl = ([id, reserve]) => {
        for(let offset = 16; offset < 80; offset += 16)
        {
            if(pia_words.getUint32(offset, true) === id)
                return { id, reserve, start: pia_words.getUint32(offset + 8, true), blocks: pia_words.getUint32(offset + 12, true) };
        }
        throw new Error("missing STL partition " + id);
    };
    const [phone, service] = [[8, 10], [10, 3]].map(stl);
    for(const volume of [phone, service])
    {
        const header = await nand_page(volume.start);
        const fields = new DataView(header.buffer);
        check(new TextDecoder().decode(header.subarray(12, 16)) === "XSR2" && fields.getUint32(4, true) === volume.reserve &&
            fields.getUint32(64, true) === volume.id && header[N97_FLASH_PAGE + 14] === 0,
            "factory STL header preserves the original partition owner, reserve, and confirmation");
    }
    const original_fat = await disk_file(disk_id(config.symbian.media.phone.path));
    const phone_page = await nand_page(phone.start, 1);
    check(await hash(new Blob([phone_page.subarray(0, N97_FLASH_PAGE)])) === await hash(original_fat.slice(0, N97_FLASH_PAGE)),
        "the first programmed phone page contains the factory FAT16 BPB and sectors");
    check((await nand_page(phone.start + phone.blocks - phone.reserve - 1, 63)).subarray(0, N97_FLASH_PAGE).every(byte => byte === 0),
        "the phone volume keeps zero-filled FAT16 sectors at its logical end");
    check((await nand_page(service.start, 1)).every(byte => byte === 0xFF), "the factory service volume is empty");
    check(config.symbian.emmc.size === N97_EMMC_SIZE && (await disk_file(disk_id(config.symbian.emmc.path))).size === N97_EMMC_INITIAL_BYTES,
        "32 GB eMMC occupies only the sparse index and FAT32 metadata blocks");
    if(local)
    {
        check(config.symbian.product_code === "0576555" && config.symbian.sw_version === "22.0.110", "original variant identity");
        check(rom.sha256 === "9c0863e379d243f953d3cfcd87d11c98231f2d0469e69244d9ee059472c99194", "original XIP digest");
        check(boot_media.sha256 === "de16da82ffe3a83fc376fefaa494470850648d5b0aec6d4507c931ada1075e74", "original DSP0/ISASW digest");
        check(nand.sha256 === "cea8bcae23f346696114c4ad88cbd037f6cae69a4706d1fced7233eb22227fcf", "factory OneNAND matches the stock-validated CLI image");
        const toc_page = N97_FLASH_HEADER + (0x80000 / N97_FLASH_PAGE) * N97_FLASH_SLOT;
        const bytes = new Uint8Array(await nand_file.slice(toc_page, toc_page + N97_FLASH_PAGE).arrayBuffer());
        bytes.forEach((byte, i) => { bytes[i] = byte ^ 0xFF; });
        check(await hash(new Blob([bytes])) === "7d205c7846a817f407f667ebb6d5e887e24fcb390561982b7850abc62acc06a1",
            "OneNAND retains the full original TOC page");
        check(JSON.stringify(config.symbian.languages) === JSON.stringify([
            { id: 37, default: false }, { id: 1, default: true }, { id: 50, default: false },
        ]), "language list read from the original ROFS overlay");
    }
    doc = await open_library();
    const row = [...doc.querySelectorAll(".vm-list [role=option]")].find(row => row.dataset.id === config.id);
    check(row?.textContent.includes("Experimental boot"), "reopened library shows the machine as experimental");
    row.click();
    doc.defaultView.open = url => { window.power_on_url = url; };
    (await until(() => button(doc, "Power on"), "Power on")).click();
    const console_frame = frame(await until(() => window.power_on_url, "console URL"));
    const { emulator, options } = await running_worker(console_frame);
    check(options.cpu_worker === true && options.machine_type === "nokia-n97", "the standard config selects the CPU Worker");
    const diagnostics = await worker_diagnostics(emulator);
    check(diagnostics.machine_type === "nokia-n97" && diagnostics.cpu_type === "arm32", "Worker ran the N97 machine");
    const chip = diagnostics.symbian.onenand;
    check(chip?.capacity === N97_FLASH_SIZE && chip.manufacturer === 0xEC && chip.device === 0x40 && chip.revision === 0x121,
        "normal Worker mapped the imported RM-505 OneNAND");
    check(diagnostics.symbian.mmc?.emmc_bytes === N97_EMMC_SIZE && diagnostics.symbian.mmc.sd_bytes === null,
        "normal Worker mapped the 32 GB eMMC and an empty optional slot");
    check(diagnostics.symbian.dma?.bytes === 0 && diagnostics.symbian.dma.errors === 0,
        "normal Worker initializes the RAPIDO DMA controller");
    check(diagnostics.symbian.rapido_boot.media_sha256 === boot_media.sha256 &&
        diagnostics.symbian.rapido_boot.bootrom_sha256 === null, "CPU Worker loads original modem media before a chip ROM is provided");
    check(console_frame.contentDocument.body.textContent.includes("RAPIDO ROM missing"), "console explains the missing chip ROM");
    check(console_frame.contentDocument.body.textContent.includes("Experimental boot"), "console names its boot milestone");
    check(!console_frame.contentDocument.querySelector("#menu_keys, #menu_devices, #iphone_install_ipa"), "no unsupported phone controls");
    await check_n97_touch(console_frame, emulator);
    await check_n97_keyboard(console_frame, emulator);
    if(local)
    {
        const retail = console_frame.contentDocument, notes = await notes_package(1);
        retail.querySelector("#symbian_send_sis").click();
        const transfer = await until(() => retail.querySelector(".sis-transfer[open]"), "retail SIS picker");
        choose(transfer.querySelector("input"), [notes]);
        (await until(() => button(transfer, "Insert transfer card"), "retail transfer ready")).click();
        await until(() => retail.querySelector(".console-notice")?.textContent.includes("Transfer card inserted"), "retail live insertion");
        const sd = (await store.get(config.id)).symbian.sd;
        check(emulator.is_running() && (await worker_diagnostics(emulator)).symbian.mmc.sd_bytes === sd.size,
            "normal retail Worker continues with the persistently inserted card");
        await power_off(console_frame);
        const image = await disk_file(disk_id(sd.path));
        check(await hash(new Blob([await read_sis_card(image, 1)])) === await hash(notes), "retail VM owns the unchanged package bytes");
        const reopened = frame("/index.html?vm=" + config.id);
        const { emulator: cold_worker } = await running_worker(reopened);
        check((await worker_diagnostics(cold_worker)).symbian.mmc.sd_bytes === sd.size, "retail VM cold-opens with its attached card");
        await power_off(reopened);
    }
    else
    {
        await until(async () => {
            const flash = (await worker_diagnostics(emulator)).symbian?.onenand;
            return flash?.programs === 3 && flash.erases === 2;
        }, "guest programs three pages and verifies the two-block erase");
        await power_off(await check_n97_keyboard_resume(console_frame, store, config.id));
    }
    if(!local)
    {
        const probe_page = N97_FLASH_HEADER + (N97_BML_USER_BLOCKS - 1) * N97_FLASH_BLOCK / N97_FLASH_PAGE * N97_FLASH_SLOT;
        const word = async image => {
            const file = await disk_file(disk_id(image.path));
            return new DataView(await file.slice(probe_page, probe_page + 2).arrayBuffer()).getUint16(0, true) ^ 0xFFFF;
        };
        check(await word(nand) === 0xA55A && await word(window.second_nand) === 0xFFFF,
            "CPU Worker flushes the programmed cells to this VM only");
        const written = await disk_file(disk_id(nand.path));
        const block_length = N97_FLASH_BLOCK / N97_FLASH_PAGE * N97_FLASH_SLOT;
        const erased = new Uint8Array(await written.slice(probe_page - 2 * block_length, probe_page).arrayBuffer());
        check(erased.length === 2 * block_length && erased.every(byte => byte === 0),
            "CPU Worker flushes both blocks' erased main and spare cells");
        const open_rom_settings = async () => {
            (await until(() => button(doc, "Edit settings…"), "edit settings")).click();
            const dialog = await until(() => doc.querySelector("dialog.settings-dialog"), "settings dialog");
            dialog.querySelector('[data-item="symbian"]').click();
            return dialog;
        };
        const select_bootrom = async (dialog, file) => {
            const label = [...dialog.querySelectorAll("label.field")].find(label => label.textContent.includes("Local RAPIDO dump"));
            choose(label.querySelector('input[type="file"]'), [file]);
            button(dialog, "Use this dump").click();
        };
        const bytes = new Uint8Array(8192);
        // Synthetic service rejection. No hardware code or positive authorization.
        bytes.set([0x00, 0x20, 0x70, 0x47], 0x1208);
        const sample = new File([bytes], "synthetic-reject.rom");
        let settings = await open_rom_settings();
        await select_bootrom(settings, new File([new Uint8Array(8192)], "empty.rom"));
        await until(() => settings.textContent.includes("no code at"), "reject empty ROM entry");
        const report = [...settings.querySelectorAll("label.field")].find(label => label.textContent.includes("ROM ID from service report"));
        report.querySelector("input").value = "BAD";
        await select_bootrom(settings, sample);
        await until(() => settings.textContent.includes("does not match RM-505"), "reject mismatching report ID");
        report.querySelector("input").value = "";
        await select_bootrom(settings, sample);
        await until(() => settings.textContent.includes("ready to save"), "stage boot ROM");
        button(settings, "Cancel").click();
        check(!(await store.get(config.id)).symbian.bootrom && (await list_disks()).length === 16, "cancel left no boot ROM");
        settings = await open_rom_settings();
        await select_bootrom(settings, sample);
        await until(() => settings.textContent.includes("ready to save"), "stage boot ROM for saving");
        const sd_input = [...settings.querySelectorAll("label.field")].find(label => label.textContent.includes("Insert a microSD image"));
        const sd_bytes = new Uint8Array(16 * 1024 ** 2);
        sd_bytes.set([23, 54, 0x55, 0xAA], 508);
        const sd = new File([sd_bytes], "fixture-sd.img");
        choose(sd_input.querySelector("input"), [sd]);
        await until(() => settings.textContent.includes("ready to insert"), "stage microSD");
        button(settings, "Save").click();
        const stored = await until(async () => (await store.get(config.id)).symbian.bootrom, "saved boot ROM");
        check(stored.sha256 === await hash(sample) && await hash(await disk_file(disk_id(stored.path))) === stored.sha256,
            "boot ROM is stored with its inspected digest");
        const saved_card = (await store.get(config.id)).symbian.sd;
        check(saved_card.sha256 === await hash(sd) && await hash(await disk_file(disk_id(saved_card.path))) === saved_card.sha256,
            "microSD insertion preserves the local image bytes");
        doc = await open_library();
        doc.querySelector('[data-id="' + config.id + '"]').click();
        window.power_on_url = null;
        doc.defaultView.open = url => { window.power_on_url = url; };
        button(doc, "Power on").click();
        const reopened = frame(await until(() => window.power_on_url, "console with boot ROM"));
        const { emulator: worker } = await running_worker(reopened);
        const { rapido_boot: loaded, mmc: media } = (await worker_diagnostics(worker)).symbian;
        check(loaded.bootrom_sha256 === stored.sha256 && loaded.media_sha256 === boot_media.sha256, "CPU Worker loaded both selected boot images");
        check(media.emmc_bytes === N97_EMMC_SIZE && media.sd_bytes === sd.size, "cold-open Worker exposes both cards");
        const flash = await until(async () => {
            const chip = (await worker_diagnostics(worker)).symbian?.onenand;
            return chip?.reads && chip;
        }, "cold-open guest reads the same programmed page");
        check(flash.programs === 0 && flash.erases === 0, "cold-open guest leaves the programmed page and erased blocks in place");
        reopened.contentDocument.querySelector("#symbian_send_sis").click();
        const occupied = await until(() => reopened.contentDocument.querySelector("dialog[open]"), "existing microSD notice");
        check(occupied.textContent.includes("A microSD is already inserted") && (await store.get(config.id)).symbian.sd.path === saved_card.path,
            "SIS transfer leaves a previously inserted card in place");
        button(occupied, "OK").click();
        await power_off(reopened);
        settings = await open_rom_settings();
        button(settings, "Eject microSD").click();
        button(settings, "Save").click();
        await until(async () => !(await store.get(config.id)).symbian.sd, "ejected microSD");
        check(await hash(await disk_file(disk_id(saved_card.path))) === saved_card.sha256, "eject preserves the old backing card bytes");

        const open_again = async () => {
            window.power_on_url = null;
            button(doc, "Power on").click();
            const next = frame(await until(() => window.power_on_url, "N97 console URL"));
            await running_worker(next);
            return next;
        };
        const sender = await open_again(), send = sender.contentDocument;
        const { emulator: sender_worker } = await running_worker(sender);
        const card_probe = async (emulator, offset) => {
            const bytes = await emulator.read_memory(0x0A080000 + offset, 4);
            return new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength).getUint32(0, true);
        };
        await until(async () => (await card_probe(sender_worker, 4)) > 0, "running ARM guest heartbeat");
        const unsaved = new Uint8Array([0x53, 0x49, 0x53, 0x21]), unsaved_address = 0x0A080800;
        await sender_worker.write_memory(unsaved, unsaved_address);
        const unsaved_matches = async emulator => (await emulator.read_memory(unsaved_address, unsaved.length)).every((byte, i) => byte === unsaved[i]);
        let stops = 0;
        sender_worker.add_listener("emulator-stopped", () => stops++);
        const insert = "Insert transfer card";
        const transfer_dialog = async () => {
            send.querySelector("#symbian_send_sis").click();
            return until(() => send.querySelector(".sis-transfer[open]"), "SIS picker");
        };
        const before = (await list_disks()).length;
        let transfer = await transfer_dialog();
        choose(transfer.querySelector("input"), [new File([new Uint8Array(24)], "wrong.sis")]);
        await until(() => transfer.textContent.includes("SIS header"), "invalid SIS rejection");
        check(!button(transfer, insert), "invalid package cannot be sent");
        const good = await Promise.all([1, 2].map(version => notes_package(version, "同名的长文件名—Notes.sisx")));
        choose(transfer.querySelector("input"), good);
        await until(() => transfer.textContent.includes("F:\\INSTALL\\PKG00002.SIS"), "review package paths");
        check(transfer.textContent.includes(good[0].name) && transfer.textContent.includes("PKG00001.SIS"), "maps same-name Unicode input to distinct paths");
        button(transfer, "Cancel").click();
        check((await list_disks()).length === before && !(await store.get(config.id)).symbian.sd, "cancel creates no card");
        transfer = await transfer_dialog();
        choose(transfer.querySelector("input"), good);
        await until(() => button(transfer, insert), "valid packages can be sent");
        send.querySelector("#symbian_send_sis").click();
        check(send.querySelectorAll(".sis-transfer[open]").length === 1, "a second transfer cannot compete in the same console");
        const duplicate = frame("/index.html?vm=" + config.id);
        await until(() => duplicate.contentDocument?.body?.textContent.includes("runs in another tab"), "competing console rejected by its Web Lock");
        duplicate.remove();
        const check_empty_after_failure = async () => {
            check(!(await store.get(config.id)).symbian.sd && (await list_disks()).length === before &&
                (await worker_diagnostics(sender_worker)).symbian.mmc.sd_bytes === null && sender_worker.is_running() &&
                stops === 0 && await unsaved_matches(sender_worker), "failed transfer leaves the running guest, empty slot and disks intact");
        };
        const storage = sender.contentWindow.navigator.storage, original_directory = storage.getDirectory;
        storage.getDirectory = async () => { throw new Error("fixture write failure"); };
        try
        {
            button(transfer, insert).click();
            await until(() => transfer.textContent.includes("fixture write failure"), "disk write failure surfaced");
            await check_empty_after_failure();
        }
        finally { storage.getDirectory = original_directory; }
        const catalog = sender.contentWindow.IDBObjectStore.prototype, original_put = catalog.put;
        catalog.put = function(value, ...args) {
            if(value?.symbian?.sd) throw new Error("fixture catalog failure");
            return original_put.call(this, value, ...args);
        };
        try
        {
            button(transfer, insert).click();
            await until(() => transfer.textContent.includes("fixture catalog failure"), "catalog failure surfaced");
            await check_empty_after_failure();
        }
        finally { catalog.put = original_put; }
        const insert_sd = sender_worker.symbian_insert_sd;
        sender_worker.symbian_insert_sd = function(file) { return insert_sd.call(this, { ...file, size: file.size + 512 }); };
        try
        {
            button(transfer, insert).click();
            await until(() => transfer.textContent.includes("the descriptor's size says"), "real backend refusal reached the running console");
            await check_empty_after_failure();
        }
        finally { sender_worker.symbian_insert_sd = insert_sd; }
        await store.update(config.id, current => ({ ...current, name: "Renamed during transfer" }));
        const heartbeat = await card_probe(sender_worker, 4);
        button(transfer, insert).click();
        await until(() => send.querySelector(".console-notice")?.textContent.includes("Transfer card inserted"), "live transfer status");
        const latest = await store.get(config.id), prepared = latest.symbian.sd;
        check(latest.name === "Renamed during transfer" && prepared && prepared.path !== saved_card.path, "live insertion preserves a concurrent rename and creates a new card");
        const wait_for_guest_sector = async emulator => {
            await until(async () => (await card_probe(emulator, 0)) === 9, "ARM guest MMC data completion");
            return new Blob([await emulator.read_memory(0x0A080200, 512)]);
        };
        const sector = await wait_for_guest_sector(sender_worker);
        check(sender_worker.is_running() && stops === 0 && (await card_probe(sender_worker, 4)) > heartbeat && await unsaved_matches(sender_worker),
            "live transfer keeps the same guest running and retains its unsaved RAM");
        check((await worker_diagnostics(sender_worker)).symbian.mmc.sd_bytes === prepared.size, "live Worker attached the transfer card");

        const resumed_transfer = await check_n97_keyboard_resume(sender, store, config.id);
        const { emulator: resumed_worker } = await running_worker(resumed_transfer);
        check(await unsaved_matches(resumed_worker) && await hash(await wait_for_guest_sector(resumed_worker)) === await hash(sector),
            "library resume preserves RAM and the attached transfer card");
        check((await store.get(config.id)).name === "Renamed during transfer", "suspend and resume keep the concurrent rename");
        await power_off(resumed_transfer);
        const image = await disk_file(disk_id(prepared.path));
        check(await hash(image) === prepared.sha256 && (await list_disks()).length === before + 1, "one private verified transfer image");
        check(await hash(sector) === await hash(image.slice(0, 512)), "live guest read the actual FAT16 boot sector over the MMC FIFO");
        for(const [index, file] of good.entries())
            check(await hash(new Blob([await read_sis_card(image, index + 1)])) === await hash(file), "byte-identical SIS on the saved card");
        const with_transfer = await open_again();
        const { emulator: transfer_worker } = await running_worker(with_transfer);
        check((await worker_diagnostics(transfer_worker)).symbian.mmc.sd_bytes === image.size &&
            await hash(await wait_for_guest_sector(transfer_worker)) === await hash(sector), "fresh CPU Worker detects and reads the same transfer card");
        await power_off(with_transfer);
    }
    store.close();
    result.textContent = local ? "PASS original firmware import, persistent storage and live SIS transfer" :
        "PASS public firmware fixture with LoSSI display, persistent storage and live SIS transfer to the running ARM guest";
}
catch(error)
{
    result.textContent = "FAIL " + error.stack;
}
</script>
